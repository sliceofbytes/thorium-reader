name: Build and Release
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            script: pack:win
            artifact: "release/*.zip"
          - os: windows-latest
            platform: win
            arch: arm64
            script: pack:win
            artifact: "release/*.zip"
          - os: macos-latest
            platform: mac
            arch: x64
            script: pack:mac
            artifact: "release/*.dmg"
          - os: macos-latest
            platform: mac
            arch: arm64
            script: pack:mac
            artifact: "release/*.dmg"
          - os: ubuntu-latest
            platform: linux
            arch: x64
            script: pack:linux
            artifact: "release/*.zip"
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            script: pack:linux
            artifact: "release/*.zip"
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --arch=${{ matrix.arch }}
    
    - name: Run tests (PR only)
      if: github.event_name == 'pull_request'
      run: npm test
    
    - name: Build (PR only)
      if: github.event_name == 'pull_request'
      run: npm run build
    
    - name: Package for release (Push only)
      if: github.event_name == 'push'
      env:
        TARGET_ARCH: ${{ matrix.arch }}
      run: npm run ${{ matrix.script }}
    
    - name: Create portable archive (Linux only)
      if: github.event_name == 'push' && matrix.platform == 'linux'
      run: |
        cd release
        if [ -d "linux-unpacked" ]; then
          zip -r "Thorium-${{ matrix.arch }}-linux-portable.zip" linux-unpacked/
        elif [ -d "linux-arm64-unpacked" ]; then
          zip -r "Thorium-${{ matrix.arch }}-linux-portable.zip" linux-arm64-unpacked/
        fi
    
    - name: List artifacts
      if: github.event_name == 'push'
      run: |
        echo "Built artifacts:"
        ls -la release/
    
    - name: Upload artifacts
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: thorium-${{ matrix.platform }}-${{ matrix.arch }}
        path: ${{ matrix.artifact }}
        retention-days: 30
  
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display structure
      run: ls -R artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: "Build ${{ github.run_number }}"
        draft: false
        prerelease: true
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
